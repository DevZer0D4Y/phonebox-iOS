# iOS shell for the PhoneBox desk panel. Generate the Xcode project with XcodeGen (brew install xcodegen):
#   cd ios && xcodegen generate && open PhoneBox.xcodeproj
# The panel itself (HTML/JS) is not copied: the app bundles android/app/src/main/assets/www as it is, so Android and
# iOS always ship the same panel.
name: PhoneBox
options:
  bundleIdPrefix: net.oxog.phonebox
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.9.19"
    CURRENT_PROJECT_VERSION: "40"
    SWIFT_VERSION: "5.0"
targets:
  PhoneBox:
    type: application
    platform: iOS
    sources:
      - path: PhoneBox
        excludes:
          - "Info.plist"
      # folder reference: lands in the app as PhoneBox.app/www
      - path: ../android/app/src/main/assets/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.oxog.phonebox.deskpanel
        PRODUCT_NAME: PhoneBox
        INFOPLIST_FILE: PhoneBox/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
